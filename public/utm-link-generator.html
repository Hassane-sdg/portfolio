<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Créer un lien suivi | Portfolio</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; color: #17202a; line-height: 1.55; }
        h1 { line-height: 1.2; }
        form { display: grid; gap: 1rem; margin: 2rem 0; }
        label { display: grid; gap: .35rem; font-weight: 600; }
        input, button, textarea { font: inherit; padding: .65rem; }
        input, textarea { border: 1px solid #667085; border-radius: .3rem; }
        button { width: fit-content; cursor: pointer; }
        textarea { width: 100%; box-sizing: border-box; }
        #status { min-height: 1.5em; }
        .hint { color: #475467; font-size: .95rem; }
    </style>
</head>
<body>
    <main>
        <h1>Créer un lien suivi</h1>
        <p>Générez dans votre navigateur un lien UTM vers le portfolio. Aucune donnée saisie ici n’est envoyée à un service tiers.</p>
        <form id="link-form">
            <label for="source">Source (plateforme)
                <input id="source" name="source" required maxlength="50" pattern="[a-z0-9]+([_-][a-z0-9]+)*" placeholder="linkedin" autocomplete="off">
            </label>
            <label for="medium">Medium (emplacement ou format)
                <input id="medium" name="medium" required maxlength="50" pattern="[a-z0-9]+([_-][a-z0-9]+)*" placeholder="profile" autocomplete="off">
            </label>
            <label for="campaign">Campaign (initiative)
                <input id="campaign" name="campaign" value="portfolio" required maxlength="50" pattern="[a-z0-9]+([_-][a-z0-9]+)*" autocomplete="off">
            </label>
            <p class="hint">Utilisez des minuscules, chiffres, tirets ou underscores, sans espace ni donnée personnelle.</p>
            <button type="submit">Générer le lien</button>
        </form>
        <label for="result">Lien suivi
            <textarea id="result" rows="3" readonly aria-live="polite"></textarea>
        </label>
        <p><button id="copy" type="button" disabled>Copier le lien</button></p>
        <p id="status" role="status" aria-live="polite"></p>
        <p><a href="./">Retour au portfolio</a></p>
    </main>
    <script>
        const form = document.querySelector("#link-form");
        const result = document.querySelector("#result");
        const copyButton = document.querySelector("#copy");
        const status = document.querySelector("#status");

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!form.reportValidity()) return;

            const url = new URL("https://hassane-sdg.github.io/portfolio/");
            url.searchParams.set("utm_source", form.elements.source.value);
            url.searchParams.set("utm_medium", form.elements.medium.value);
            url.searchParams.set("utm_campaign", form.elements.campaign.value);
            result.value = url.toString();
            copyButton.disabled = false;
            status.textContent = "Lien généré.";
        });

        copyButton.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(result.value);
                status.textContent = "Lien copié.";
            } catch (error) {
                status.textContent = "Copie automatique impossible. Sélectionnez et copiez le lien manuellement.";
                console.error("Impossible de copier le lien suivi.", error);
            }
        });
    </script>
</body>
</html>
