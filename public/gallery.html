<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie | Moctar Hassane</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #00ff9d;
            --secondary-color: #0088ff;
            --accent-color: #ff00ff;
            --dark-bg: #0a0a14;
            --card-bg: rgba(20, 25, 45, 0.9);
            --text-color: #e0f0ff;
        }
        body {
            font-family: 'Exo 2', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
        }
        header { position: fixed; top: 0; width: 100%; z-index: 1000; background-color: rgba(10, 10, 20, 0.9); padding: 1rem; border-bottom: 1px solid rgba(0, 255, 157, 0.3); }
        header a { color: var(--primary-color); text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 0.5rem; }
        .container { max-width: 1400px; margin: 100px auto; padding: 2rem; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .gallery-grid {
            display: flex;
            gap: 1.5rem;
            min-width: 100%;
            padding: 0;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, rgba(0,255,157,0.1), rgba(0,136,255,0.1));
            border: 1px solid rgba(0,255,157,0.2);
            aspect-ratio: 1 / 1;
            flex: 0 0 250px;
            min-width: 250px;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .gallery-item:hover img { transform: scale(1.1); }
        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .gallery-item:hover .gallery-overlay { opacity: 1; }
        .gallery-overlay i { color: var(--primary-color); font-size: 2.5rem; }
        
        /* Modal Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .modal-content {
            position: relative;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        .close {
            position: absolute;
            right: 40px;
            top: 20px;
            color: var(--primary-color);
            font-size: 2rem;
            cursor: pointer;
            z-index: 2001;
        }
        .close:hover { text-shadow: 0 0 10px var(--primary-color); }
        
        .filter-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        .filter-btn {
            padding: 0.7rem 1.5rem;
            background: transparent;
            color: var(--primary-color);
            border: 1px solid rgba(0,255,157,0.5);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Exo 2', sans-serif;
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: var(--dark-bg);
            border-color: var(--primary-color);
        }

        /* Boutons de navigation galerie */
        .gallery-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .gallery-nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: var(--dark-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 255, 157, 0.3);
        }

        .gallery-nav-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 6px 25px rgba(0, 255, 157, 0.6);
        }

        .gallery-nav-btn:active {
            transform: scale(0.95);
        }

        .gallery-container {
            flex: 1;
            overflow-x: auto;
            scroll-behavior: smooth;
            display: flex;
            gap: 1.5rem;
            padding: 1rem 0;
            position: relative;
        }

        .gallery-container::-webkit-scrollbar {
            height: 6px;
        }

        .gallery-container::-webkit-scrollbar-track {
            background: rgba(0, 255, 157, 0.1);
            border-radius: 3px;
        }

        .gallery-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
        }

        .gallery-container::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        @media (max-width: 768px) {
            .gallery-wrapper {
                gap: 0.8rem;
            }

            .gallery-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }

        footer { background: rgba(10,10,20,0.8); padding: 2rem; text-align: center; margin-top: 4rem; border-top: 1px solid rgba(0,255,157,0.2); }
        @media (max-width: 768px) { h1 { font-size: 2rem; } .container { margin-top: 80px; padding: 1rem; } .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
    </style>
</head>
<body>
    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Retour au Portfolio</a>
    </header>

    <div class="container">
        <h1>🖼️ Galerie de Réalisations</h1>
        <p style="font-size: 1.1rem; margin-bottom: 2rem; color: var(--secondary-color); text-align: center;">Portfolio visuel de mes projets et réalisations techniques</p>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="projects">Projets</button>
            <button class="filter-btn" data-filter="prototypes">Prototypes</button>
            <button class="filter-btn" data-filter="workshops">Ateliers</button>
            <button class="filter-btn" data-filter="events">Événements</button>
        </div>

        <div class="gallery-wrapper">
            <button class="gallery-nav-btn" id="scrollLeftBtn" title="Défiler à gauche">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="gallery-container" id="galleryContainer">
                <div class="gallery-grid" id="gallery">
                    <!-- Projets -->
                    <div class="gallery-item" data-category="projects">
                        <img src="assets/projects/Drone%20agricole/agras-t60-farm-1-6.webp" alt="Drone agricole">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="projects">
                        <img src="assets/projects/Glaci%C3%A8re%20%C3%A0%20Modules%20peltier/61JNvPXjniL._AC_UF894%2C1000_QL80_.jpg" alt="Glacière à modules Peltier">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="projects">
                        <img src="assets/projects/Pissiculture%20et%20jardinnage/Aquaponics-Intelligent-System-Agricultural-Planting-and-Breeding-Volume.webp" alt="Pisciculture et jardinage">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="projects">
                        <img src="assets/projects/Home%20garden/images.jpe" alt="Home garden intelligent">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="projects">
                        <img src="assets/projects/Hydroponie%20intelligente/images.jpe" alt="Hydroponie intelligente">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>

                    <!-- Prototypes -->
                    <div class="gallery-item" data-category="prototypes">
                        <img src="assets/projects/Glaci%C3%A8re%20%C3%A0%20Modules%20peltier/images%20%282%29.jpe" alt="Prototype de glacière Peltier">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="prototypes">
                        <img src="assets/projects/Drone%20agricole/image1.jpe" alt="Prototype de drone agricole">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="prototypes">
                        <img src="assets/projects/Hydroponie%20intelligente/images%20%281%29.jpe" alt="Installation hydroponique">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="prototypes">
                        <img src="assets/projects/Pissiculture%20et%20jardinnage/images%20%281%29.jpe" alt="Installation aquaponique">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>

                    <!-- Ateliers -->
                    <div class="gallery-item" data-category="workshops">
                        <img src="assets/gallery/Atelier/IMG-20240217-WA0001.jpg" alt="Atelier technique">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="workshops">
                        <img src="assets/gallery/Atelier/IMG-20240217-WA0006.jpg" alt="Atelier de prototypage">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="workshops">
                        <img src="assets/gallery/Atelier/NOUVEAU%20CHASSIS.PNG" alt="Nouveau châssis en atelier">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="workshops">
                        <img src="assets/gallery/Atelier/IMG_20260619_154640_666.jpg" alt="Session de travail en atelier">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>

                    <!-- Événements -->
                    <div class="gallery-item" data-category="events">
                        <img src="assets/gallery/Evenements/WhatsApp%20Image%202026-09-24%20at%2016.02.10%20%284%29.jpeg" alt="Événement technique">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="events">
                        <img src="assets/gallery/Evenements/WhatsApp%20Image%202026-09-24%20at%2016.13.05%20%281%29.jpeg" alt="Présentation lors d'un événement">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="events">
                        <img src="assets/gallery/Evenements/WhatsApp%20Image%202026-09-24%20at%2016.13.05.jpeg" alt="Événement communautaire">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                    <div class="gallery-item" data-category="events">
                        <img src="assets/gallery/Evenements/WhatsApp%20Image%202026-09-24%20at%2016.13.06%20%282%29.jpeg" alt="Rencontre technique">
                        <div class="gallery-overlay"><i class="fas fa-magnifying-glass"></i></div>
                    </div>
                </div>
            </div>
            <button class="gallery-nav-btn" id="scrollRightBtn" title="Défiler à droite">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Modal Lightbox -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sawadogo Moctar Hassane | Yolsii Viima Tech</p>
    </footer>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeBtn = document.querySelector('.close');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');
        const galleryContainer = document.getElementById('galleryContainer');
        const scrollLeftBtn = document.getElementById('scrollLeftBtn');
        const scrollRightBtn = document.getElementById('scrollRightBtn');

        // Lightbox
        galleryItems.forEach(item => {
            item.addEventListener('click', function() {
                const img = this.querySelector('img');
                modalImage.src = img.src;
                modal.style.display = 'block';
            });
        });

        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Filtre
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const filter = this.getAttribute('data-filter');
                
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                galleryItems.forEach(item => {
                    if (filter === 'all' || item.getAttribute('data-category') === filter) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // Navigation galerie - Défilement horizontal
        const scrollAmount = 280; // Largeur d'une item + gap

        scrollLeftBtn.addEventListener('click', () => {
            galleryContainer.scrollBy({
                left: -scrollAmount,
                behavior: 'smooth'
            });
        });

        scrollRightBtn.addEventListener('click', () => {
            galleryContainer.scrollBy({
                left: scrollAmount,
                behavior: 'smooth'
            });
        });

        // Clavier - Flèches gauche/droite
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'block') return;
            
            if (e.key === 'ArrowLeft') {
                scrollLeftBtn.click();
            } else if (e.key === 'ArrowRight') {
                scrollRightBtn.click();
            }
        });
    </script>
</body>
</html>
