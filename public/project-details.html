<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets de Moctar Hassane Sawadogo | Yolsii Viima Tech</title>
    <meta name="description" content="Fiches détaillées des projets de Moctar Hassane Sawadogo en électronique, prototypage, systèmes embarqués, robotique et agriculture intelligente.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://hassane-sdg.github.io/portfolio/project-details.html?project=glacier">
    <meta property="og:type" content="article">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:title" content="Projets de Moctar Hassane Sawadogo">
    <meta property="og:description" content="Fiches de projets en électronique, systèmes embarqués, robotique et agriculture intelligente.">
    <meta property="og:image" content="https://hassane-sdg.github.io/portfolio/assets/images/IDPhoto_20241031_233053.jpg">
    <meta property="og:url" content="https://hassane-sdg.github.io/portfolio/project-details.html?project=glacier">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Projets de Moctar Hassane Sawadogo">
    <meta name="twitter:description" content="Projets d’électronique, de systèmes embarqués, de robotique et d’agriculture intelligente.">
    <meta name="twitter:image" content="https://hassane-sdg.github.io/portfolio/assets/images/IDPhoto_20241031_233053.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#00ff9d; --secondary:#0088ff; --accent:#ff00ff; --dark:#0a0a14; --card:rgba(20,25,45,.92); --text:#e0f0ff; }
        * { box-sizing:border-box; margin:0; }
        body { min-height:100vh; background:var(--dark); color:var(--text); font-family:'Exo 2',sans-serif; line-height:1.6; }
        header { position:sticky; top:0; z-index:2; padding:1rem 2rem; background:rgba(10,10,20,.94); border-bottom:1px solid rgba(0,255,157,.3); backdrop-filter:blur(10px); }
        header a { color:var(--primary); text-decoration:none; font-family:'Share Tech Mono',monospace; }
        main { max-width:1100px; margin:0 auto; padding:5rem 2rem; }
        h1,h2 { font-family:'Orbitron',sans-serif; }
        h1 { margin-bottom:1rem; font-size:clamp(2rem,5vw,4rem); background:linear-gradient(90deg,var(--primary),var(--secondary)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        h2 { margin:2.5rem 0 1rem; color:var(--primary); }
        .hero,.panel { padding:2rem; border:1px solid rgba(0,255,157,.25); border-radius:12px; background:linear-gradient(135deg,rgba(0,255,157,.1),rgba(0,136,255,.08)); }
        .hero p { max-width:800px; }
        .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
        .gallery img { width:100%; height:210px; object-fit:cover; border-radius:8px; border:1px solid rgba(0,255,157,.2); }
        .empty { min-height:180px; display:grid; place-items:center; padding:2rem; border:1px dashed rgba(224,240,255,.3); color:rgba(224,240,255,.65); text-align:center; font-family:'Share Tech Mono',monospace; }
        ul { padding-left:1.4rem; }
        .btn { display:inline-flex; gap:.6rem; align-items:center; margin-top:2rem; padding:.9rem 1.4rem; border-radius:4px; background:linear-gradient(90deg,var(--primary),var(--secondary)); color:var(--dark); text-decoration:none; font-weight:700; }
    </style>
</head>
<body>
    <header><a href="index.html#projects"><i class="fas fa-arrow-left"></i> Retour aux projets</a></header>
    <main>
        <section class="hero">
            <h1 id="projectTitle">Détails du projet</h1>
            <p id="projectSummary"></p>
        </section>
        <h2>Galerie du projet</h2>
        <div id="projectGallery" class="gallery"></div>
        <section class="panel">
            <h2>Présentation</h2>
            <p id="projectDescription"></p>
            <h2>Points clés</h2>
            <ul id="projectFeatures"></ul>
        </section>
        <a class="btn" href="index.html#projects"><i class="fas fa-layer-group"></i> Voir les autres projets</a>
    </main>
    <script>
        const projects = {
            glacier: {
                title: 'Glacière à modules Peltier',
                summary: 'Prototype de refroidissement compact basé sur l’effet thermoélectrique.',
                description: 'Ce projet explore une solution de refroidissement portable et la régulation thermique par modules Peltier.',
                features: ['Étude du refroidissement thermoélectrique', 'Prototypage électronique', 'Gestion de la température'],
                images: ['assets/projects/Glaci%C3%A8re%20%C3%A0%20Modules%20peltier/61JNvPXjniL._AC_UF894%2C1000_QL80_.jpg', 'assets/projects/Glaci%C3%A8re%20%C3%A0%20Modules%20peltier/images%20%282%29.jpe']
            },
            pisciculture: {
                title: 'Pisciculture et jardinage automatisés',
                summary: 'Système intégré pour associer élevage, culture et gestion raisonnée de l’eau.',
                description: 'Une approche aquaponique orientée vers l’autonomie alimentaire et l’automatisation progressive des cycles de culture.',
                features: ['Suivi des paramètres', 'Irrigation automatisée', 'Optimisation de la consommation d’eau'],
                images: ['assets/projects/Pissiculture%20et%20jardinnage/71eJ765qW4L._AC_UF894%2C1000_QL80_.jpg', 'assets/projects/Pissiculture%20et%20jardinnage/Aquaponics-Intelligent-System-Agricultural-Planting-and-Breeding-Volume.webp', 'assets/projects/Pissiculture%20et%20jardinnage/images%20%281%29.jpe']
            },
            robot: {
                title: 'Robot Éboueur Téléopéré pour le nettoyage des caniveaux',
                summary: 'Projet de fin de formation consacré à la conception d’un robot téléopéré pour le nettoyage des caniveaux.',
                description: 'Le projet associe conception mécanique, motorisation, électronique embarquée, capteurs, communication sans fil et supervision à distance pour répondre à un besoin local.',
                features: ['Conception mécanique et motorisation', 'Électronique embarquée et capteurs', 'Communication sans fil et téléopération', 'Supervision à distance'],
                images: []
            },
            home: {
                title: 'Home garden intelligent',
                summary: 'Système de jardinage assisté par capteurs et automatisation.',
                description: 'Le projet vise à faciliter le suivi d’un espace de culture et à améliorer la régularité de l’arrosage.',
                features: ['Suivi de culture', 'Gestion de l’arrosage', 'Approche domotique'],
                images: ['assets/projects/Home%20garden/images%20%281%29.jpe', 'assets/projects/Home%20garden/images.jpe']
            },
            hydroponie: {
                title: 'Hydroponie intelligente',
                summary: 'Culture hors-sol avec suivi des paramètres et gestion optimisée des ressources.',
                description: 'Une démarche d’agriculture intelligente centrée sur la maîtrise de l’eau et le suivi des conditions de culture.',
                features: ['Culture hors-sol', 'Suivi des paramètres', 'Irrigation optimisée'],
                images: ['assets/projects/Hydroponie%20intelligente/images%20%281%29.jpe', 'assets/projects/Hydroponie%20intelligente/images%20%282%29.jpe', 'assets/projects/Hydroponie%20intelligente/images.jpe']
            }
        };

        const key = new URLSearchParams(window.location.search).get('project') || 'glacier';
        const project = projects[key] || projects.glacier;
        const canonicalUrl = new URL('https://hassane-sdg.github.io/portfolio/project-details.html');
        canonicalUrl.searchParams.set('project', projects[key] ? key : 'glacier');
        const pageTitle = `${project.title} | Moctar Hassane Sawadogo`;
        const pageDescription = `${project.summary} Projet de Moctar Hassane Sawadogo, Ingénieur de Travaux en Électronique et Informatique Industrielle au Burkina Faso.`;
        document.title = pageTitle;
        document.querySelector('link[rel="canonical"]').href = canonicalUrl.href;
        document.querySelector('meta[name="description"]').content = pageDescription;
        document.querySelector('meta[property="og:title"]').content = pageTitle;
        document.querySelector('meta[property="og:description"]').content = pageDescription;
        document.querySelector('meta[property="og:url"]').content = canonicalUrl.href;
        document.querySelector('meta[name="twitter:title"]').content = pageTitle;
        document.querySelector('meta[name="twitter:description"]').content = pageDescription;
        document.getElementById('projectTitle').textContent = project.title;
        document.getElementById('projectSummary').textContent = project.summary;
        document.getElementById('projectDescription').textContent = project.description;
        document.getElementById('projectFeatures').innerHTML = project.features.map(feature => `<li>${feature}</li>`).join('');
        const gallery = document.getElementById('projectGallery');
        gallery.innerHTML = project.images.length
            ? project.images.map((src, index) => `<img src="${src}" alt="${project.title} - image ${index + 1}" loading="lazy">`).join('')
            : '<div class="empty">Les images de ce projet sont momentanément indisponibles.</div>';
    </script>
</body>
</html>
